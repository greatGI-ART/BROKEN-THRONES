name: Build Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install
        run: npm ci
      - name: Copy game into the app
        run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../TheBrokenThrones.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TheBrokenThrones-apk
          path: TheBrokenThrones.apk
      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: The Broken Thrones (latest build)
          body: Download TheBrokenThrones.apk below on your Android phone and open it to install.
          files: TheBrokenThrones.apk
          make_latest: true
